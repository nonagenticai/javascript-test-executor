services:
  javascript-test-executor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: javascript-test-executor
    ports:
      - "0.0.0.0:8085:8085"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      PORT: 8085
      TEST_MODE: "true"
    networks:
      - workflow-system-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  workflow-system-network:
    driver: bridge
