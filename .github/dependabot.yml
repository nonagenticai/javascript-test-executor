version: 2

# Dependabot replaces the org's private Renovate preset: a public repository cannot inherit a
# preset hosted in a private one.

# package.json and src/package.json carry a range-scoped `minimatch` override for
# GHSA-g3hv-75wg-m249 (vulnerable >=7.0.0 <11.0.1, no patched 10.x, and jest cannot cross to 11
# in range). Without the override the security-update job errors instead of opening a PR.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/src"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # @babel/core 8 is a whole-toolchain major, not a bump: @babel/preset-env 7.29
    # requires core ^7.0.0-0, so the image build's `npm ci` fails ERESOLVE with core
    # 8.1.0 (PR #4, run 43618410203). Hold it until preset-env 8 and the plugin set
    # can move together; the checks job passes alone because it never installs /src.
    ignore:
      - dependency-name: "@babel/core"
        versions: [">=8.0.0"]
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7
